[phases.setup]
nixPkgs = ["python313", "python313Packages.pip"]
aptPkgs = ["python3-tk", "xvfb", "ffmpeg", "libgl1", "libglib2.0-0", "fonts-noto-cjk", "fonts-dejavu-core"]

[phases.install]
cmds = [
  "pip install -r requirements.txt"
]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile - --error-logfile -"
