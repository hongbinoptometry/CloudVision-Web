<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cloud Vision 自我篩檢</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="wrap narrow"><header class="hero"><div class="brand">Cloud Vision</div><h1>視覺功能自我篩檢</h1><div class="progress"><div id="bar"></div></div></header>
<section id="s1" class="card step active"><h2>1. 單眼視力自我評估</h2><p>距離螢幕約 1 公尺，左右眼分開遮眼，選擇最接近的結果。</p><label>右眼</label><select id="vr"><option value="">請選擇</option><option>1.0以上</option><option>0.8</option><option>0.6</option><option>0.4</option><option>0.2以下</option></select><label>左眼</label><select id="vl"><option value="">請選擇</option><option>1.0以上</option><option>0.8</option><option>0.6</option><option>0.4</option><option>0.2以下</option></select><button class="btn primary full" onclick="next(2)">下一步</button></section>
<section id="s2" class="card step"><h2>2. 30 公分近距閱讀</h2><p class="reading">請在約 30 公分閱讀：<br><b>今天陽光明亮，我可以清楚閱讀這一行文字。</b></p><div class="choices"><button onclick="pickNear(this,'可以清楚閱讀')">可以清楚閱讀</button><button onclick="pickNear(this,'模糊或吃力')">模糊或吃力</button></div><button id="n2" class="btn primary full" disabled onclick="next(3)">下一步</button></section>
<section id="s3" class="card step"><h2>3. 散光鐘</h2><p>左右眼分開遮眼，比較所有方向線條深淺。</p><div class="dial"></div><label>右眼</label><select id="ar"><option value="">請選擇</option><option>所有線條一樣深</option><option>線條深淺不一樣</option></select><label>左眼</label><select id="al"><option value="">請選擇</option><option>所有線條一樣深</option><option>線條深淺不一樣</option></select><button class="btn primary full" onclick="next(4)">下一步</button></section>
<section id="s4" class="card step"><h2>4. Amsler 方格</h2><p>左右眼分開遮眼，持續注視中央黑點。</p><div class="amsler"><span></span></div><label>右眼</label><select id="mr"><option value="">請選擇</option><option>線條筆直且完整</option><option>線條扭曲、模糊或缺損</option></select><label>左眼</label><select id="ml"><option value="">請選擇</option><option>線條筆直且完整</option><option>線條扭曲、模糊或缺損</option></select><button class="btn primary full" onclick="next(5)">下一步</button></section>
<section id="s5" class="card step"><h2>5. 結果與預約</h2><p>留下聯絡資料並非必填。需要專業驗光服務時可選擇預約。</p><label>姓名</label><input id="name"><label>電話</label><input id="phone" inputmode="tel"><label>是否希望安排預約</label><select id="appointment" onchange="toggleAppt()"><option>暫時不需要</option><option>希望安排預約</option></select><div id="apptBox" hidden><label>預約日期</label><input id="ad" type="date"><label>時段</label><select id="at"><option>上午</option><option>下午</option><option>晚上</option></select></div><label>備註</label><textarea id="note" rows="3"></textarea><button class="btn primary full" onclick="submitResult()">送出結果</button><p id="msg" class="status"></p></section></main>
<script>
let near='';function next(n){if(n===2&&(!vr.value||!vl.value))return alert('請先選擇左右眼視力');if(n===4&&(!ar.value||!al.value))return alert('請先完成左右眼散光鐘');if(n===5&&(!mr.value||!ml.value))return alert('請先完成左右眼 Amsler');document.querySelectorAll('.step').forEach(x=>x.classList.remove('active'));document.getElementById('s'+n).classList.add('active');bar.style.width=((n-1)/4*100)+'%';scrollTo(0,0)}function pickNear(b,v){near=v;document.querySelectorAll('#s2 .choices button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');n2.disabled=false}function toggleAppt(){apptBox.hidden=appointment.value!=='希望安排預約'}async function submitResult(){const data={visual_acuity_right:vr.value,visual_acuity_left:vl.value,near_reading:near,astigmatism_right:ar.value,astigmatism_left:al.value,amsler_right:mr.value,amsler_left:ml.value,name:name.value,phone:phone.value,appointment:appointment.value,appointment_date:ad.value,appointment_time:at.value,note:note.value,device:navigator.userAgent,visitor_id:localStorage.getItem('cloudVisionVisitorId')||crypto.randomUUID()};localStorage.setItem('cloudVisionVisitorId',data.visitor_id);msg.textContent='正在送出…';try{const r=await fetch('/cloud/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!j.ok)throw 0;msg.textContent='✓ 結果已成功送出';}catch(e){msg.textContent='送出失敗，請稍後再試';}}
</script></body></html>
