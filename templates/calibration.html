<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5 公分螢幕校正</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="wrap narrow"><header class="hero"><div class="brand">Cloud Vision</div><h1>5 公分螢幕校正</h1></header><section class="card"><p>請用實體尺量下方黑線，輸入實際量到的公分數。</p><div id="line" class="cal-line"></div><label>實際量到的長度（公分）</label><input id="measured" type="number" min="1" max="15" step="0.01" value="5.00"><button class="btn primary full" onclick="saveCal()">儲存校正</button><p id="status" class="status"></p><a class="btn secondary full" href="/cloud/assessment">校正完成，開始篩檢</a></section></main><script>const BASE=188.976;function saveCal(){const v=parseFloat(document.getElementById('measured').value);if(!v||v<=0)return;const factor=5/v;localStorage.setItem('cloudVisionCalibrationFactor',String(factor));document.getElementById('status').textContent='✓ 校正已儲存';}window.addEventListener('load',()=>{document.getElementById('line').style.width=BASE+'px';});</script></body></html>
